[package]
name = "dj_scan_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "dj_scan_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
crossbeam-channel = "0.5"
czkawka_core = { path = "../../crates/czkawka_core" }
pyo3 = { version = "0.22", features = ["abi3-py311", "auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
