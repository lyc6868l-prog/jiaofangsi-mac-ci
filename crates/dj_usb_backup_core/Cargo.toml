[package]
name = "dj_usb_backup_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "dj_usb_backup_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
hex = "0.4"
pyo3 = { version = "0.22", features = ["abi3-py311", "auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
